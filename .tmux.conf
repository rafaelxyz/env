## Keybindings

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M; send-keys -M; send-keys -M; send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M; send-keys -M; send-keys -M; send-keys -M' 'copy-mode -e; send-keys -M; send-keys -M; send-keys -M; send-keys -M'"

bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M; send-keys -M; send-keys -M; send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M; send-keys -M; send-keys -M; send-keys -M' 'copy-mode -e; send-keys -M; send-keys -M; send-keys -M; send-keys -M'"

bind s split-window -v -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'
bind < resize-pane -L 5
bind > resize-pane -R 5
bind - resize-pane -D 5
bind + resize-pane -U 5
bind-key -n F1 select-window -t 1
bind-key -n F2 select-window -t 2
bind-key -n F3 select-window -t 3
bind-key -n F4 select-window -t 4
bind-key -n F9 swap-pane -U \; select-pane -D
bind-key -n F10 swap-pane -D \; select-pane -U

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +([[:graph:]]+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

# Start window numbering from 1 instead of 0
set -g base-index 1

# Start pane numbering from 1 instead of 0
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Clear terminal without interfering with vim-tmux-navigator
bind-key L send-keys C-l

# run ranger, but don't if in vim
bind-key -n 'C-o' if-shell "$is_vim" 'send-keys C-o' 'send-keys ranger_cd Enter'

set -g mouse on
set -g focus-events on
set-option -g history-limit 5000
set-option -sg escape-time 10

# Use a broadly supported terminal entry, including native macOS.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-kitty:RGB'

# Use the native clipboard on macOS and X11 when xsel is available.
if-shell 'test "$(uname -s)" = Darwin' {
  set -s copy-command 'pbcopy'
} {
  if-shell 'command -v xsel >/dev/null 2>&1' {
    set -s copy-command 'xsel -ib'
  }
}

# new terminals in cwd
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Catppuccin
# Default for non-macOS; macOS starts with its current appearance.
set -g @catppuccin_flavor "latte"
set -g @catppuccin_window_status_style "rounded"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.3.1'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'

# Sync Catppuccin with macOS at tmux startup. The launchd dark-notify watcher
# calls the same script when the system switches between light and dark.
if-shell 'test "$(uname -s)" = Darwin' {
  run-shell -b '$HOME/.local/bin/tmux-appearance'
}
