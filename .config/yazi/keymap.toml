# Preserve familiar Ranger shortcuts while retaining all Yazi defaults.
[[mgr.prepend_keymap]]
on = "F"
run = 'search --via=fd --args="-d 5"'
desc = "Search files with fd (maximum depth 5)"

[[mgr.prepend_keymap]]
on = "<F8>"
run = "remove"
desc = "Move selected files to Trash"

[[mgr.prepend_keymap]]
on = "<Delete>"
run = "remove"
desc = "Move selected files to Trash"

[[mgr.prepend_keymap]]
on   = [ "g", "r" ]
run  = "cd ~/repo"
desc = "Go to projects"

[[mgr.prepend_keymap]]
on   = [ "g", "e" ]
run  = "cd ~/env"
desc = "Go to dotfiles"

[[mgr.prepend_keymap]]
on   = [ "g", "o" ]
run  = "cd ~/Documents"
desc = "Go to Documents"

